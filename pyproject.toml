[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-codemeta"
version = "0.1.0"
description = "CodeMeta-focused schema.org models built with Pydantic v2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Allen Lee", email = "allen.lee@asu.edu" },
]
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "typing-extensions>=4.7; python_version<'3.13'",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "twine>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
