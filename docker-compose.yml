services:
  test:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        APPUSER: ${APPUSER:-scicodes}
    image: codemeta-pydantic:local
    working_dir: /app
    volumes:
      - .:/app
      - /app/.venv
    command: pytest -q

  package:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        APPUSER: ${APPUSER:-scicodes}
    image: codemeta-pydantic:local
    working_dir: /app
    volumes:
      - .:/app
      - /app/.venv
    command: sh -lc "rm -rf dist build && uv build"
